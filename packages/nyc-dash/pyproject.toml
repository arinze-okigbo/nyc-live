[project]
name = "nyc-dash"
version = "0.1.0"
description = "nyc-dash: FastAPI + MapLibre/Deck.gl live dashboard over the nyc-live service layer."
requires-python = ">=3.12,<3.13"
dependencies = ["nyc-live", "fastapi>=0.111", "uvicorn[standard]>=0.30"]

[project.scripts]
nyc-dash = "nyc_dash.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_dash"]

[tool.uv.sources]
nyc-live = { workspace = true }
