[project]
name = "nyc-mcp"
version = "0.1.0"
description = "nyc-mcp: MCP server exposing NYC live civic data as tools (FastMCP)."
requires-python = ">=3.12,<3.13"
dependencies = ["nyc-live", "fastmcp>=2.0"]

[project.scripts]
nyc-mcp = "nyc_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_mcp"]

[tool.uv.sources]
nyc-live = { workspace = true }
