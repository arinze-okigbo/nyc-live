[project]
name = "nyc-vision"
version = "0.1.0"
description = "nyc-vision: YOLO density pipeline over DOT camera frames, writes counts to DuckDB."
requires-python = ">=3.12,<3.13"
dependencies = ["nyc-live", "pillow>=10.0", "numpy>=1.26"]
# ultralytics/torch are added in Phase 3 by cv-engineer via the pytorch-cpu index (see CLAUDE.md).

[project.scripts]
nyc-vision = "nyc_vision.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_vision"]

[tool.uv.sources]
nyc-live = { workspace = true }
